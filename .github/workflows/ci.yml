name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  qualidade:
    name: Formatação, lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: OpenAPI versionado está em dia
        run: |
          npm run openapi:export
          npx prettier --write docs/openapi.json
          git diff --exit-code docs/openapi.json || { echo "::error::docs/openapi.json desatualizado. Rode npm run openapi:export."; exit 1; }

  testes:
    name: Testes (unitários, HTTP e Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Testes com cobertura mínima de 80%
        run: npm test
      - name: Resumo da cobertura
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| Métrica | % |\n|---|---|\n'+['lines','branches','functions','statements'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  seguranca:
    name: Segurança (dependências, segredos, Dockerfile e imagem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dependências de produção sem vulnerabilidade alta ou crítica
        run: npm audit --omit=dev --audit-level=high
      - name: Segredos no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Boas práticas do Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Build da imagem
        run: docker build -t fiapx-video-api:ci .
      - name: Vulnerabilidades da imagem (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fiapx-video-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Conferir configuração
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN não configurado: análise pulada. Crie o projeto no SonarQube Cloud e cadastre o token em Settings → Secrets."
            echo "ativo=false" >> "$GITHUB_OUTPUT"
          else
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          fi
          org="${{ vars.SONAR_ORGANIZATION }}"
          org="${org:-$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')}"
          echo "org=$org" >> "$GITHUB_OUTPUT"
          echo "chave=${org}_${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: Análise e quality gate
        if: steps.sonar.outputs.ativo == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ steps.sonar.outputs.org }}
            -Dsonar.projectKey=${{ steps.sonar.outputs.chave }}
            -Dsonar.qualitygate.wait=true
